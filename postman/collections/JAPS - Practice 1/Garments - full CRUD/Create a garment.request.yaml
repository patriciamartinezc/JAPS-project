$kind: http-request
description: Creates a garment. The new id is saved in the variable garmentId.
url: "{{baseUrl}}/garments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "The Linen Overshirt",
      "category": "shirts",
      "price": 98,
      "material": "Washed linen, 190 gsm",
      "inStock": true,
      "image": "images/linen-overshirt.png"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));
      pm.test("Location header", () => pm.expect(pm.response.headers.get("Location")).to.include("/api/garments/"));
      pm.collectionVariables.set("garmentId", pm.response.json().id);
    language: text/javascript
order: 2000
