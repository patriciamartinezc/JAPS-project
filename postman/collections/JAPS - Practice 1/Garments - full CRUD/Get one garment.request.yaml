$kind: http-request
description: The garment created in the previous request.
url: "{{baseUrl}}/garments/{{garmentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("the garment we created", () => pm.expect(pm.response.json().name).to.eql("The Linen Overshirt"));
    language: text/javascript
order: 3000
