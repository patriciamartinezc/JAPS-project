$kind: http-request
description: The garment is gone.
url: "{{baseUrl}}/garments/{{garmentId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("404 Not Found", () => pm.response.to.have.status(404));
      pm.test("JSON error", () => pm.expect(pm.response.json().error).to.eql("Garment not found"));
    language: text/javascript
order: 6000
